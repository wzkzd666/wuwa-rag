[project]
name = "wuwa-rag"
version = "0.1.0"
description = "鸣潮(Wuthering Waves) 角色知识助手 - LangGraph + 混合检索 RAG"
readme = "README.md"
authors = [
    { name = "wangzhikan", email = "wzkzd666@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"

dependencies = [
    # ================= Web / API =================
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
    "slowapi>=0.1.9",                       # api/ratelimit.py：限流（令牌桶/滑窗，可选 Redis 存储）
    # ================= 存储（PG 为唯一真源） =================
    "psycopg[binary,pool]>=3.2",            # 同步：DDL / ETL / 写入
    "sqlalchemy>=2.0",                      # PostgresSaver / 后续 ORM
    "neo4j>=5.28",                          # 角色属性 + 组队关系
    "redis>=5.2",                           # 缓存 + Celery broker
    "boto3>=1.35",                          # S3 协议访问 RustFS
    # ================= LLM / Agent =================
    "langchain[mcp]>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",                # qwen3-vl:8b：生成 + 立绘视觉
    "langchain-openai>=0.2",                # ChatOpenAI：vLLM / Ollama /v1 / 云端（内含 openai SDK）
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",   # PostgresSaver 多轮记忆
    "jinja2>=3.1",                          # ChatPromptTemplate
    # ================= 检索 =================
    "chromadb>=0.6",                        # 稠密向量（原生客户端，RRF 自己控）
    "sentence-transformers>=3.3",           # bge-m3 + bge-reranker-v2-m3（CPU）
    "jieba>=0.42",                          # 中文分词 -> BM25
    "rank-bm25>=0.2",                       # 应用层 BM25（稀疏路）
    # ================= 任务队列 =================
    "celery>=5.4",
    # ================= 凭证加密 =================
    "cryptography>=44",                     # llmstore：用户云端 API-KEY 落库前加密；
    # 缺失时云模型配置功能整体降级（延迟导入 + try/except）
    # ================= 工具 =================
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "loguru>=0.7",
    "tenacity>=9.0",                        # 重试 / 熔断
    "markdownify>=0.14",                    # 采集侧 HTML -> Markdown
    "beautifulsoup4>=4.12",
    "langchain-text-splitters>=1.1.2",
    "wuwa-mcp>=2.2.1",
    "torch>=2.14.0",
    "httpcore>=1.0.9",
    "qianfan>=0.2.5",
    "tqdm>=4.70.1",
    "concurrent-log-handler>=0.9.29",
    # ⚠️ pytest 只在 [project.optional-dependencies].dev（`uv sync --extra dev`）——
    # 它是**跑测试的工具**，不是运行时依赖，放主依赖会让生产环境/开源用户白装。
]

[project.optional-dependencies]
# 音乐播放（tools/qqmusic_mcp）。QQ音乐 MCP server 依赖；
# 不装 QQ音乐客户端 / 不启用音乐功能的人完全不需要它。
music = [
    "mcp>=2.0",
    "psutil>=5.9",
    # 应用级音量（Core Audio ISimpleAudioVolume），只改 QQ音乐不动系统音量
    "pycaw>=20260927",
    # SMTC：读/控系统媒体会话（确认播放是否真的发生、控制播放）
    "winrt-Windows.Media.Control>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Foundation.Collections>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ipykernel>=6.29",
]
# LoRA 训练专用依赖，仅训练时使用：uv sync --extra train
train = [
    "torchvision>=0.29.0",
    "torchaudio>=2.11.0",
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
]

[project.scripts]
wuwa-chunk = "wuwa_rag.knowledge.crawl.chunker:main"
wuwa-ingest = "wuwa_rag.knowledge.crawl.pipeline:main"
wuwa-index = "wuwa_rag.knowledge.index.build_index:main"
wuwa-graph = "wuwa_rag.knowledge.graph.build_graph:main"
wuwa-ingest-character = "wuwa_rag.tasks.worker:ingest_cli"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuwa_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio 1.x 起默认 strict：不显式声明 asyncio_mode，异步用例会被静默跳过
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
